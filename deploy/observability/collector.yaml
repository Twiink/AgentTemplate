# 同一 OTLP 链路由 Collector 分发；只启用实际已配置的 exporter。
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  otlphttp/langfuse:
    traces_endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:LANGFUSE_AUTH}
  otlphttp/langsmith:
    traces_endpoint: ${env:LANGSMITH_OTLP_ENDPOINT}
    headers:
      x-api-key: ${env:LANGSMITH_API_KEY}
      Langsmith-Project: ${env:LANGSMITH_PROJECT}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/langfuse, otlphttp/langsmith]
