# api 使用外部数据库、Redis 和 S3；只有 scheduler 保持单副本。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: agent-api}
  template:
    metadata:
      labels: {app: agent-api}
    spec:
      securityContext:
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: agent-template:0.2.0
          envFrom:
            - configMapRef: {name: agent-config}
            - secretRef: {name: agent-secrets}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /opt/app/.data}
          ports: [{containerPort: 8000}]
          startupProbe:
            httpGet: {path: /health/live, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
