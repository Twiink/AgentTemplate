# 基础服务：两档共用。启动：docker compose --env-file .data/compose.env up -d
# 镜像依赖由 .data/compose.env 中的 AGENT_EXTRAS 决定，init 按预设写入。
name: ${COMPOSE_PROJECT_NAME:-agent-template}
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: agent_owner
      POSTGRES_DB: ${AGENT_DB_NAME:-agenttemplate}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?请先执行 agent-template init}
    ports:
    - 127.0.0.1:5433:5432
    volumes:
    - postgres-data:/var/lib/postgresql
    - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U agent_owner -d ${AGENT_DB_NAME:-agenttemplate}
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2.1-alpine
    ports:
    - 127.0.0.1:6380:6379
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      retries: 20
  migrate:
    build:
      context: .
      args:
        EXTRAS: ${AGENT_EXTRAS-full}
    image: agent-template:local
    user: ${UID:-1000}:${GID:-1000}
    command:
    - agent-template
    - migrate
    environment:
      AGENT_DATABASE_URL: postgresql+asyncpg://agent_app:${AGENT_DB_PASSWORD}@postgres:5432/${AGENT_DB_NAME:-agenttemplate}
      AGENT_MIGRATION_DATABASE_URL: postgresql+asyncpg://agent_owner:${AGENT_DB_PASSWORD}@postgres:5432/${AGENT_DB_NAME:-agenttemplate}
      AGENT_REDIS_URL: redis://redis:6379/0
    volumes:
    - ./config/private.yaml:/opt/app/config/private.yaml:ro
    - ./.data:/opt/app/.data
    - ./prompts:/opt/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  api:
    image: agent-template:local
    build:
      context: .
      args:
        EXTRAS: ${AGENT_EXTRAS-full}
    user: ${UID:-1000}:${GID:-1000}
    environment:
      AGENT_DATABASE_URL: postgresql+asyncpg://agent_app:${AGENT_DB_PASSWORD}@postgres:5432/${AGENT_DB_NAME:-agenttemplate}
      AGENT_MIGRATION_DATABASE_URL: postgresql+asyncpg://agent_owner:${AGENT_DB_PASSWORD}@postgres:5432/${AGENT_DB_NAME:-agenttemplate}
      AGENT_REDIS_URL: redis://redis:6379/0
    volumes:
    - ./config/private.yaml:/opt/app/config/private.yaml:ro
    - ./.data:/opt/app/.data
    - ./prompts:/opt/app/prompts:ro
    ports:
    - 127.0.0.1:8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
volumes:
  postgres-data: null
  redis-data: null
