[project]
name = "agent-template"
version = "0.1.0"
description = "A FastAPI starter for building AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=2.3.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
providers = [
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
]
worker = [
    "celery[redis]>=5.6.3",
]
auth = [
    "pwdlib[argon2]>=0.3.1",
    "pyjwt[crypto]>=2.15.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
