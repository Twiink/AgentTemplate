[project]
name = "agent-template"
version = "0.2.0"
description = "通用 Agent 开发工程底座"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# 核心依赖：两档都需要。模块专属依赖放在 optional-dependencies，按预设安装。
dependencies = [
  "alembic>=1.20,<2", "asyncpg>=0.32,<1", "sqlalchemy[asyncio]>=2.1,<3",
  "psycopg[binary,pool]>=3.3,<4", "redis>=8.1,<9",
  "fastapi[standard]>=0.142,<1", "httpx>=0.28,<1", "aiohttp>=3.13,<4", "jsonschema>=4.26,<5", "sqlglot>=28,<32", "pydantic-settings>=2.15,<3",
  "pyyaml>=6,<7", "structlog>=26,<27", "prometheus-client>=0.26,<1",
  "pyjwt[crypto]>=2.15,<3", "typer>=0.24,<1",
  "langchain[mcp]>=1.4,<2", "langgraph>=1.2,<2", "langgraph-checkpoint-postgres>=3.1,<4",
  "langchain-openai>=1,<2", "langchain-anthropic>=1,<2", "langchain-google-genai>=4,<5",
  "mcp>=2.3,<3",
  # langchain 的 mcp extra 声明了 fastmcp，但 extras 在锁定时未被解析进来；
  # langchain.mcp.MCPAdapter 在导入时依赖它，因此显式声明并锁定版本。
  "fastmcp>=4.0.1,<5",
  "opentelemetry-sdk>=1.39,<2", "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
  "opentelemetry-instrumentation-httpx>=0.60b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.60b0,<1",
  "opentelemetry-instrumentation-redis>=0.60b0,<1",
  "opentelemetry-instrumentation-celery>=0.60b0,<1",
  "openinference-instrumentation-langchain>=0.2,<1",
  "sentry-sdk[fastapi]>=2.0,<3",
  "langsmith>=0.14,<1",
  "trafilatura>=1.13,<2",
]

# minimal 只安装核心依赖；full 安装全部模块依赖：uv sync --extra full。
[project.optional-dependencies]
background = ["celery[redis]>=5.6,<6"]
# LlamaIndex 只用于 RAG 数据侧（读取、切分与导入），不参与 Agent 运行。
knowledge = [
  "llama-index-core>=0.14,<1",
  "pgvector>=0.5,<1", "pypdf>=6,<7", "python-docx>=1.2,<2", "beautifulsoup4>=4.14,<5",
]
s3 = ["boto3>=1.42,<2"]
full = ["agent-template[background,knowledge,s3]"]

[project.scripts]
agent-template = "app.cli:cli"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = ["ruff>=0.16,<1", "ty>=0.0.85,<1"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
