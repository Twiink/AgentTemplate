# 公共非敏感配置。连接串和凭据放入 private.yaml 或 AGENT_* 环境变量。
app_name: AgentTemplate
run_timeout_seconds: 300
run_token_budget: 64000
recursion_limit: 25
lease_seconds: 60
run_retention_days: 30
# Agent 自动发现：扫描 src/app/agents/*/agent.py 的 spec；enabled 为空表示全部启用。
agents:
  enabled: []
  extraction: null
# 模型别名白名单：只有这里声明的别名才能被引用；单价统一来自 config/pricing.yaml。
llm:
  models: {}
  embeddings: {}
  default_embedding: null
tracing:
  enabled: false
  capture_content: false
